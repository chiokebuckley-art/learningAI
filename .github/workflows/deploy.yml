name: Deploy learningAI to GitHub Pages

# The site is published by GitHub Pages from the gh-pages branch
# (Settings → Pages → Deploy from a branch). This keeps gh-pages
# in sync with main so every push to main goes live automatically.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish main to gh-pages
        run: git push --force origin HEAD:refs/heads/gh-pages
